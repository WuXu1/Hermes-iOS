name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build Unsigned IPA
        run: |
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh Hermes.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          path: Hermes.ipa
          archive: false

      - name: Publish to Personal Source Latest Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh release upload Latest Hermes.ipa --clobber -R WuXu1/personal-ios-repo-assets
          fi
